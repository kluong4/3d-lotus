<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Glowing Lotus - Three.js</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background-color: #000;
    display: flex;
    justify-content: center;
    align-items: center;
}

canvas {
    display: block;
}
</style>

<!-- Import the Three.js 3D library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<script>
// 1. Set up the scene and camera
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0, 5, 11);
camera.lookAt(0, 1, 0); // FIX: aim the camera at the flower's center height

const renderer = new THREE.WebGLRenderer({ antialias: true });

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

document.body.appendChild(renderer.domElement);


// 2. Magical lighting (Ambient & Point Lights)
const ambientLight = new THREE.AmbientLight(0xffb6c1, 0.8);
scene.add(ambientLight);

const centerLight = new THREE.PointLight(0xff69b4, 3, 20);
centerLight.position.set(0, 1, 0);

scene.add(centerLight);


// 3. Glowing crystal petal material (Glass/Glow Material)
const petalMaterial = new THREE.MeshPhysicalMaterial({
    color: 0xffb6c1,
    emissive: 0xff1493,
    emissiveIntensity: 0.3,
    roughness: 0.1,
    transmission: 0.6, // Glass-like transparency
    clearcoat: 1.0,
    clearcoatRoughness: 0.1,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.85
});


// 4. Create the petal shape (Petal Geometry)
function createPetalShape() {
    const shape = new THREE.Shape();

    shape.moveTo(0, 0);

    shape.bezierCurveTo(
        0.8, 1,
        1.2, 2.5,
        0, 4
    );

    shape.bezierCurveTo(
        -1.2, 2.5,
        -0.8, 1,
        0, 0
    );

    const extrudeSettings = {
        depth: 0.05,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.02,
        bevelThickness: 0.02 // FIX: without this, Three.js defaults to 6 (!),
                              // turning the petal's thin depth into a 12-unit slab
    };

    const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);

    // FIX #1: the shape was authored pointing "up" the local Y axis (0,0) -> (0,4).
    // Rotate it -90deg around Z so it instead points "outward" along local X.
    // That way, spinning the pivot group around the world Y axis actually
    // fans the petals out around the flower instead of just spinning them
    // in place around their own long axis.
    geometry.rotateZ(-Math.PI / 2);

    // FIX #2: after the rotation above, the petal's thin "depth" (0.05)
    // dimension points along Z (tangentially) - which makes each petal a
    // thin vertical fin/shard sticking straight up, not a broad flat petal.
    // Rotating 90deg around X moves that thin dimension onto Y (vertical)
    // instead, so the petal lies flat and wide (growth along X, width along
    // Z) the way a real lotus petal does. rotation.z on the mesh (used in
    // the opening animation below) then correctly tilts it from flat/open
    // up to vertical/closed.
    geometry.rotateX(Math.PI / 2);

    return geometry;
}

const petalGeometry = createPetalShape();
const flowerGroup = new THREE.Group();


// 5. Create layers of petals and distribute them to form the flower
const petals = [];

const layers = [
    { count: 6, scale: 0.6, angleOffset: 0.9, yOffset: 1.4 },
    { count: 10, scale: 0.85, angleOffset: 1.15, yOffset: 0.8 },
    { count: 14, scale: 1.1, angleOffset: 1.35, yOffset: 0.2 }
];

layers.forEach((layer) => {

    for (let i = 0; i < layer.count; i++) {

        const petalMesh = new THREE.Mesh(
            petalGeometry,
            petalMaterial
        );

        const angle = (i / layer.count) * Math.PI * 2
            + Math.random() * 0.05; // slight jitter so it doesn't look too mechanical

        const pivotGroup = new THREE.Group();

        petalMesh.scale.set(
            layer.scale,
            layer.scale,
            layer.scale
        );

        // Petal now points along local +X (outward) after the geometry rotate above.
        // Start closed: standing nearly upright, wrapped around the center.
        petalMesh.rotation.z = Math.PI / 2 - 0.15;

        pivotGroup.position.y = layer.yOffset;
        pivotGroup.rotation.y = angle; // FIX: this now correctly fans petals radially

        pivotGroup.add(petalMesh);
        flowerGroup.add(pivotGroup);

        // Store the petals so they can be animated later
        petals.push({
            mesh: petalMesh,
            openRotation: Math.PI / 2 - layer.angleOffset // target angle when fully open
        });
    }
});

scene.add(flowerGroup);


// 6. Glowing flower center (Glow Core)
const coreGeo = new THREE.SphereGeometry(0.4, 32, 32);

const coreMat = new THREE.MeshBasicMaterial({
    color: 0xffffff
});

const core = new THREE.Mesh(coreGeo, coreMat);

core.position.y = 1.6;

scene.add(core);


// 7. Opening and rotation animation (Animation Loop)
let progress = 0;
const startRotation = Math.PI / 2 - 0.15;

function animate() {

    requestAnimationFrame(animate);

    // Slowly rotate the entire flower
    flowerGroup.rotation.y += 0.003;

    // Gradually open the petals
    if (progress < 1) {

        progress += 0.004;

        petals.forEach(item => {
            // FIX: animate rotation.z (tilts the petal from upright to
            // outward-spread), not rotation.x (which just twisted the
            // petal around its own outward-pointing axis and did nothing visible).
            item.mesh.rotation.z =
                startRotation + progress * (item.openRotation - startRotation);
        });
    }

    renderer.render(scene, camera);
}

animate();


// Reset the size when the window is resized
window.addEventListener('resize', () => {

    camera.aspect =
        window.innerWidth / window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
});

</script>

</body>
</html>
